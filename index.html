<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Jewce</title>
  <meta name="description" content="Jewce.com — hello world.">
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1b2735 0%, #090a0f 100%);
      color: #f4f4f5;
      text-align: center;
    }
    main { padding: 2rem; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;

    p { font-size: clamp(1rem, 3vw, 1.25rem); opacity: 0.7; margin: 0; }
  </style>
</head>

  <main>
    <h1>Hello, world.</h1>
